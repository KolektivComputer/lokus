services:
  postgres:
    image: postgres:16-alpine
    container_name: locus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: locus
      POSTGRES_PASSWORD: locus
      POSTGRES_DB: locus
    ports:
      - "5432:5432"
    volumes:
      - locus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locus -d locus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: API + DB together.
  #   docker compose --profile full up --build
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: locus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      LOCUS_DB_USER: locus
      LOCUS_DB_PASS: locus
    volumes:
      - ./docker/config:/config
      - ./extensions:/extensions:ro
    # locus api [<options>] <configdirectory>
    command: ["api", "--host", "0.0.0.0", "--port", "8080", "/config"]
    profiles:
      - full

volumes:
  locus_pgdata:
