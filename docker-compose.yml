services:
  postgres:
    image: postgres:16-alpine
    container_name: thingy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thingy
      POSTGRES_PASSWORD: thingy
      POSTGRES_DB: thingy
    ports:
      - "5432:5432"
    volumes:
      - thingy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thingy -d thingy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the API against the local DB.
  # Build first: docker compose build api
  # Config dir is mounted from ./docker/config
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: thingy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OVERLAY_DB_USER: thingy
      OVERLAY_DB_PASS: thingy
    volumes:
      - ./docker/config:/config:ro
      - ./extensions:/extensions:ro
    command: ["/config", "api", "--host", "0.0.0.0", "--port", "8080"]
    profiles:
      - full

volumes:
  thingy_pgdata:
